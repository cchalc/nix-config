# AeroSpace configuration — managed by nix-config (symlinked from repo ./config).
# Adapted from omerxx/dotfiles. Guide: https://nikitabobko.github.io/AeroSpace/guide
# Reload after edits from the `service` mode (alt-shift-; then esc) or the menu bar.

after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change, and (re)apply JankyBorders styling.
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=0'
]

# Start-at-login is now managed by nix (see the aerospace module note).
# Sketchybar has its own launchd agent, so they both start at login.
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[[on-window-detected]]
if.app-name-regex-substring = 'slack'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'whatsapp'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'chrome'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'omnigent'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'obsidian'
run = 'layout floating'

# Claude desktop app (includes Claude Cowork windows — app-name is "Claude").
[[on-window-detected]]
if.app-name-regex-substring = 'claude'
run = 'layout floating'

# Kept system apps.
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'safari'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'mail'
run = 'layout floating'

# Possible values: (qwerty|dvorak)
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Small gaps so tiled windows fill the screen. The main monitor keeps a wider
# outer.right (~80) to leave room for the vertical (position=right) sketchybar
# (~50 bar + 10 margin); all other edges use a thin 8px gutter.
[gaps]
inner.horizontal = [{ monitor.main = 8 }, 8]
inner.vertical =   [{ monitor.main = 8 }, 8]
outer.left =       [{ monitor.main = 8 }, 8]
outer.right =      [{ monitor.main = 80 }, 8]
outer.bottom =     [{ monitor.main = 8 }, 8]
outer.top =        [{ monitor.main = 8 }, 8]

# 'main' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]

# Zoom / fullscreen. `fullscreen` only acts on TILED windows, but this config
# auto-floats many apps (see on-window-detected rules), so we first force the
# focused window to tiling, then fullscreen it — this makes alt-f zoom ANY
# window regardless of float state. Pressing alt-f again toggles fullscreen off
# (the `layout tiling` is then a harmless no-op on the already-tiled window).
# --no-outer-gaps fills the whole screen (plain fullscreen keeps the large
# main-monitor outer gaps below, leaving ~350px empty on each side).
alt-f = ['layout tiling', 'fullscreen --no-outer-gaps']
alt-ctrl-shift-f = ['layout tiling', 'fullscreen --no-outer-gaps']
# Pop a window out to floating / back into the tiles (order of args doesn't
# matter — it toggles). This is how you "pop out" and "pop in" a window.
alt-ctrl-f = 'layout floating tiling'

alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus. h/j/k/l mirror the tmux/herdr pane-nav ergonomics on this machine.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize.
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspaces.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

# Move focused window to workspace.
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'

# Cycle workspaces with [ / ] (prev / next), wrapping around. Mirrors the
# herdr prev/next-workspace bindings (prefix+[ / prefix+]) for a consistent
# "brackets = navigate, shift = bring the window along" scheme across tools.
# --no-stdin: workspace next|prev reads stdin; without this flag it errors when
# there's no TTY (AeroSpace v0.20+ breaking change). Explicit is safe here.
alt-leftSquareBracket = 'workspace --wrap-around --no-stdin prev'
alt-rightSquareBracket = 'workspace --wrap-around --no-stdin next'
# Move the focused window to the prev/next workspace and follow it there.
alt-shift-leftSquareBracket = 'move-node-to-workspace --wrap-around --no-stdin --focus-follows-window prev'
alt-shift-rightSquareBracket = 'move-node-to-workspace --wrap-around --no-stdin --focus-follows-window next'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Binding modes.
alt-shift-semicolon = 'mode service'
alt-shift-enter = 'mode apps'

# App launchers (adapted to this machine). alt-w opens Ghostty (this machine's
# terminal); Obsidian and Slack are installed. omerxx's WezTerm/Zen/Brain.fm/
# Final Cut binds are dropped since those apps aren't present here.
alt-w = 'exec-and-forget open -a Ghostty'
alt-o = 'exec-and-forget open -a /Applications/Obsidian.app'
alt-s = 'exec-and-forget open -a /Applications/Slack.app'
alt-q = 'exec-and-forget open -a "/System/Applications/QuickTime Player.app"'
# alt-e opens Finder (alt-f is now zoom/fullscreen — see the binding above).
alt-e = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'

# 'service' binding mode declaration.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']

[mode.apps.binding]
alt-w = ['exec-and-forget open -a Ghostty', 'mode main']

# omerxx's [workspace-to-monitor-force-assignment] (his Dell monitors) is
# intentionally omitted — those patterns won't match this machine's displays.
