
# ~/.config/starship.toml
# ─────────────────────────────────────────────
# TOP LEVEL
# ─────────────────────────────────────────────
add_newline = true
command_timeout = 2000

# Powerline-style left prompt + right prompt for time/duration
format = """
[](fg:#a3aed2)\
[$directory](bg:#a3aed2 fg:#090c0c bold)\
[](fg:#769ff0 bg:#a3aed2)\
[$git_branch$git_status$git_metrics](bg:#769ff0 fg:#090c0c)\
[](fg:#394260 bg:#769ff0)\
[$nodejs$elixir$rust$python$nix_shell](bg:#394260 fg:#ffffff)\
[](fg:#212736 bg:#394260)\
[$custom.databricks$custom.devenv](bg:#212736 fg:#769ff0)\
[ ](bg:#212736)\
$fill\
$os $character"""

right_format = "$cmd_duration$time"

continuation_prompt = "▶▶ "

# ─────────────────────────────────────────────
# LAYOUT
# ─────────────────────────────────────────────

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold white"

[os.symbols]
Macos = " "
Linux = " "
Windows = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────
# DIRECTORY
# ─────────────────────────────────────────────

[directory]
format = " 󰉋 $path$read_only "
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
style = "bg:#a3aed2 fg:#090c0c bold"

# ─────────────────────────────────────────────
# GIT
# ─────────────────────────────────────────────

[git_branch]
format = " $symbol$branch "
symbol = " "
style = "bg:#769ff0 fg:#090c0c"
truncation_length = 20

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bg:#769ff0 fg:#090c0c"
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_metrics]
disabled = false
added_style = "bold green bg:#769ff0"
deleted_style = "bold red bg:#769ff0"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# ─────────────────────────────────────────────
# LANGUAGES & RUNTIMES
# ─────────────────────────────────────────────

[nodejs]
format = "[ $symbol($version) ](bg:#394260)"
symbol = " "
style = "bg:#394260 fg:#ffffff"
detect_files = ["package.json"]

[elixir]
format = "[ $symbol($version) ](bg:#394260)"
symbol = " "
style = "bg:#394260 fg:#ffffff"
detect_files = ["mix.exs"]

[rust]
format = "[ $symbol($version) ](bg:#394260)"
symbol = " "
style = "bg:#394260 fg:#ffffff"

[python]
format = "[ $symbol($version) ](bg:#394260)"
symbol = " "
style = "bg:#394260 fg:#ffffff"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]

[nix_shell]
format = "[ $symbol$state( \\($name\\)) ](bg:#394260)"
symbol = " "
style = "bg:#394260 fg:#89dceb"
impure_msg = "impure"
pure_msg = "pure"

# ─────────────────────────────────────────────
# CUSTOM MODULES
# ─────────────────────────────────────────────

[custom.databricks]
description = "Show active Databricks profile"
command = "echo ${DATABRICKS_CONFIG_PROFILE:-default}"
when = "test -n \"$DATABRICKS_CONFIG_PROFILE\""
symbol = "🧱 "
style = "bold bg:#212736 fg:#769ff0"
format = "[ $symbol$output ]($style)"

[custom.devenv]
description = "Show active devenv.sh environment"
command = "basename $PWD"
when = "test -f devenv.nix"
symbol = "❄️  "
style = "bold bg:#212736 fg:#89dceb"
format = "[ $symbol$output ]($style)"

# ─────────────────────────────────────────────
# RIGHT PROMPT
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 1_000
format = "[ 󱑍 $duration]($style) "
style = "bold yellow"
show_notifications = true
min_time_to_notify = 30_000

[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%H:%M"
style = "bold dimmed white"