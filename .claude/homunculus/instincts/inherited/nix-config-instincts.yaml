# Nix Config Workflow Add New Home Manager Module

## Action

Follow the add-new-home-manager-module workflow:
1. Create a new directory under modules/home-manager/ for the tool (e.g., tmux, jujutsu).
2. Add default.nix and any relevant config files (e.g., tmux.conf).
3. Edit modules/home-manager/default.nix to include the new module.
4. Commit the changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~0x per month
- Files: modules/home-manager/<tool>/default.nix, modules/home-manager/<tool>/*, modules/home-manager/default.nix

